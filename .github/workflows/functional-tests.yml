name: Functional Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

concurrency:
  group: functional-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Path prefixes (regex alternation) that trigger the functional tests
  FT_PATHS: functional-tests/|packages/|examples/react-spa-npm/|.github/workflows/functional-tests.yml

jobs:
  gate:
    name: Functional Tests Gate
    if: github.event.pull_request.head.repo.fork == false && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check approval and changed paths
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          decision=$(gh pr view "$PR" --repo "$REPO" --json reviewDecision --jq .reviewDecision)
          relevant=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/files" | jq --arg re "^($FT_PATHS)" '
            add | map(.filename | select(test($re))) | length')
          echo "decision=$decision relevant_files=$relevant"
          if [ "$decision" = "APPROVED" ] && [ "$relevant" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  functional-tests:
    name: Functional Tests
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FT_AUTH0_DOMAIN: ${{ secrets.FT_AUTH0_DOMAIN }}
      FT_AUTH0_SPA_CLIENT_ID: ${{ secrets.FT_AUTH0_SPA_CLIENT_ID }}
      FT_AUTH0_MGMT_CLIENT_ID: ${{ secrets.FT_AUTH0_MGMT_CLIENT_ID }}
      FT_AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.FT_AUTH0_MGMT_CLIENT_SECRET }}
      FT_TEST_USER_EMAIL: ${{ secrets.FT_TEST_USER_EMAIL }}
      FT_TEST_USER_PASSWORD: ${{ secrets.FT_TEST_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: functional-tests/.nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter=@auth0/universal-components-react

      - name: Install Playwright browsers
        working-directory: functional-tests
        run: pnpm exec playwright install --with-deps chromium ffmpeg

      - name: Check CPU Cores
        run: lscpu | grep "CPU(s):"

      - name: Create ephemeral test org
        working-directory: functional-tests
        run: pnpm run org:setup

      - name: Run Playwright tests
        working-directory: functional-tests
        # TODO: remove --pass-with-no-tests in specs pr
        run: pnpm exec playwright test --pass-with-no-tests

      - name: Teardown ephemeral test org
        if: always()
        working-directory: functional-tests
        run: pnpm run org:teardown

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            functional-tests/playwright-report/
            functional-tests/test-results/
          retention-days: 3
          if-no-files-found: ignore
