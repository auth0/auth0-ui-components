name: Functional Tests

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
  workflow_call:

concurrency:
  # One shared queue for run-ft: all runs hit the same tenant, SPA client and test user.
  # Anything else (other labels, manual, publish gate) gets its own group via run_id so it
  # can't displace a queued run-ft run or the release gate.
  group: functional-tests-${{ github.event.label.name == 'run-ft' && 'shared' || github.run_id }}
  cancel-in-progress: false

jobs:
  consume-label:
    name: Consume run-ft label
    if: github.event_name == 'pull_request' && github.event.label.name == 'run-ft'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove run-ft label
        run: gh pr edit "$PR_NUMBER" --remove-label run-ft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  functional-tests:
    name: Functional Tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-ft' &&
      github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FT_AUTH0_DOMAIN: ${{ secrets.FT_AUTH0_DOMAIN }}
      FT_AUTH0_SPA_CLIENT_ID: ${{ secrets.FT_AUTH0_SPA_CLIENT_ID }}
      FT_AUTH0_MGMT_CLIENT_ID: ${{ secrets.FT_AUTH0_MGMT_CLIENT_ID }}
      FT_AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.FT_AUTH0_MGMT_CLIENT_SECRET }}
      FT_TEST_USER_EMAIL: ${{ secrets.FT_TEST_USER_EMAIL }}
      FT_TEST_USER_PASSWORD: ${{ secrets.FT_TEST_USER_PASSWORD }}
      FT_OKTA_DOMAIN: ${{ secrets.FT_OKTA_DOMAIN }}
      FT_OKTA_CLIENT_ID: ${{ secrets.FT_OKTA_CLIENT_ID }}
      FT_OKTA_CLIENT_SECRET: ${{ secrets.FT_OKTA_CLIENT_SECRET }}
      FT_OKTA_SSO_USER_EMAIL: ${{ secrets.FT_OKTA_SSO_USER_EMAIL }}
      FT_OKTA_SSO_USER_PASSWORD: ${{ secrets.FT_OKTA_SSO_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: functional-tests/.nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter=@auth0/universal-components-react

      - name: Install Playwright browsers
        working-directory: functional-tests
        run: pnpm exec playwright install --with-deps chromium ffmpeg

      - name: Create ephemeral test org
        working-directory: functional-tests
        run: pnpm run org:setup

      - name: Run Playwright tests
        working-directory: functional-tests
        # TODO: remove --pass-with-no-tests in specs pr
        run: pnpm exec playwright test --pass-with-no-tests

      - name: Teardown ephemeral test org
        if: always()
        working-directory: functional-tests
        run: pnpm run org:teardown

      # Videos only: the HTML report's step titles include typed input and artifacts are public.
      # TODO: upload the full report once there is a private location for it.
      - name: Upload failure videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-videos
          path: functional-tests/test-results/**/*.webm
          retention-days: 3
          if-no-files-found: ignore
